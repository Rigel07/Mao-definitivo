name: Build Corazón de Melón

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Compilar mod
        run: ./gradlew build --no-daemon

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: corazon-de-melon
          path: build/libs/*.jar
